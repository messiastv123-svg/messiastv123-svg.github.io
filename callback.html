<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Verbunden · Curly Orion Studio</title>
<style>
  :root { color-scheme: light dark; --text: #1d1d21; --leise: #5c5f66; --grund: #f6f6f8; --karte: #fff; --rand: #e3e3ea; --akzent: #6b5bd6; }
  @media (prefers-color-scheme: dark) { :root { --text: #ececf0; --leise: #a3a6ad; --grund: #141417; --karte: #1e1f23; --rand: #2c2d33; --akzent: #b4a5ff; } }
  body { margin: 0; background: var(--grund); color: var(--text); font: 16px/1.6 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  .karte { background: var(--karte); border: 1px solid var(--rand); border-radius: 16px; padding: 18px 22px; margin-top: 16px; }
  code { display: block; overflow-wrap: anywhere; font-size: 13px; color: var(--leise); margin: 8px 0 14px; }
  button { font: inherit; padding: 10px 18px; border-radius: 10px; border: 0; background: var(--akzent); color: #fff; cursor: pointer; }
  p { color: var(--leise); }
</style>
</head>
<body>
<main>
  <h1>Fast fertig</h1>
  <p>Kopiere diese Adresse und füge sie in Curly Orion Studio beim Account unter „Verbinden“ ein.<br>
  <span lang="en">Copy this address and paste it into Curly Orion Studio to finish connecting.</span></p>
  <div class="karte">
    <code id="adresse"></code>
    <button id="kopieren" type="button">Adresse kopieren</button>
  </div>
</main>
<script>
  const adresse = location.href;
  document.getElementById("adresse").textContent = adresse;
  document.getElementById("kopieren").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(adresse); document.getElementById("kopieren").textContent = "Kopiert ✓"; }
    catch { document.getElementById("kopieren").textContent = "Bitte von Hand markieren und kopieren"; }
  });
</script>
</body>
</html>
