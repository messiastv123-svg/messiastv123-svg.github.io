<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <title>Orion Studio</title>
  <defs>
    <linearGradient id="grund" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2550"/>
      <stop offset="1" stop-color="#14121f"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9bfff"/>
      <stop offset="1" stop-color="#7b6be6"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#grund)"/>
  <!-- Ring = „O“ von Orion, darin der Gürtel des Orion (drei Sterne) und ein Play-Dreieck fürs Studio -->
  <circle cx="60" cy="60" r="34" fill="none" stroke="url(#ring)" stroke-width="9"/>
  <path d="M52 45 L76 60 L52 75 Z" fill="#ffffff"/>
  <circle cx="30" cy="30" r="4" fill="#ffffff"/>
  <circle cx="90" cy="24" r="3" fill="#c9bfff"/>
  <circle cx="94" cy="96" r="3.5" fill="#ffffff"/>
</svg>
